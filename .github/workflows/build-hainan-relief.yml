name: Build natural-color satellite-derived terrain for Hainan

on:
  push:
    branches: [feature/terrain-fish-duo-v38]
    paths:
      - 'scripts/build_hainan_relief.py'
      - '.github/workflows/build-hainan-relief.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terrain-fish-duo-v38
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial image decoder
        run: python -m pip install 'Pillow==11.3.0'
      - name: Crop natural-color land cover and relief into tiny aligned Hainan WebP
        run: python scripts/build_hainan_relief.py
      - name: Commit only derived public-domain regional illustration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maps/hainan-relief.webp
          if git diff --cached --quiet; then
            echo "No change to local map"
          else
            git commit -m "assets(v38): real natural-color Hainan terrain"
            git fetch origin feature/terrain-fish-duo-v38
            git rebase origin/feature/terrain-fish-duo-v38
            git push origin HEAD:feature/terrain-fish-duo-v38
          fi
