name: Sanya Guide quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game progress and content
        run: node --experimental-default-type=module --test tests/test_explore.mjs
      - name: Run full app browser and offline regression suite
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 -u tests/run_tests.py
