name: Sanya Guide quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate XP, map math and editorial content
        run: |
          node --experimental-default-type=module --test tests/test_explore.mjs
          node --experimental-default-type=module --test tests/test_v24.mjs
          node --experimental-default-type=module --test tests/test_prep_focus.mjs
          node --experimental-default-type=module --test tests/test_ranks.mjs
      - name: Test Island Quest onboarding, gameplay, old screens and offline
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 -u tests/test_v23_browser.py
      - name: Test live street map, photo reviews, XP and offline fallback
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 -u tests/test_v24_browser.py
      - name: Test preflight home, checklist XP and confirmed reset
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 -u tests/test_v25_browser.py
      - name: Check legacy data, passport, map and PWA upgrade
        env:
          CHROME: /usr/bin/google-chrome
          SANYA_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -u tests/run_tests.py static unit passport map upgrade
      - name: Capture before and after screenshots
        if: always()
        env:
          CHROME: /usr/bin/google-chrome
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach /tmp/sanya-baseline "$BASE_SHA"
          python3 -u tests/capture_game.py /tmp/sanya-baseline "$PWD" /tmp/sanya-shots
      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-before-after
          path: /tmp/sanya-shots/*.png
          retention-days: 14
