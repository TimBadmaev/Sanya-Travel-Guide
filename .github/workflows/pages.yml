# Публикация только самого приложения на GitHub Pages (D-12).
#
# Зачем: при обычной публикации «Deploy from a branch → /(root)» GitHub Pages
# отдаёт ВЕСЬ репозиторий — включая внутренние *.md, личный план владельца
# `yalongwan-plan.html`, `tools/` и файлы редактора. Этот workflow собирает
# артефакт вручную и кладёт в него только те файлы, которые нужны приложению.
#
# Автоматическая публикация после обновления основной ветки main.
# Для успешного развёртывания нужен Settings → Pages → Source: GitHub Actions.
# workflow_dispatch сохранён для ручного повторного развёртывания.
# Если источник Pages переключён на Deploy from a branch, GitHub Pages может
# продолжать публиковать из ветки; проверить источник в настройках репозитория.
name: Publish app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Список = index.html + всё, что перечислено в PRECACHE (sw.js), плюс
      # .nojekyll. Новый каталог приложения нужно добавить сюда вручную —
      # сборки в проекте нет (D-23), как и у PRECACHE.
      - name: Собрать каталог публикации
        run: |
          set -eu
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp -R css js data assets _site/

          # Быстрая защита от публикации неполного приложения.
          test -s _site/index.html
          test -s _site/sw.js
          test -s _site/js/views/travel-center.js
          test -s _site/js/logic/travel-center.js
          grep -q 'js/views/travel-center.js' _site/sw.js
          grep -q 'js/logic/travel-center.js' _site/sw.js
          test ! -e _site/yalongwan-plan.html
          test ! -e _site/README.md
          test ! -e _site/.mcp.json
          echo "--- опубликовано будет:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
