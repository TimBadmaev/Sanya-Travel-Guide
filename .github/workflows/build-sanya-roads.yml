name: Build offline Sanya map features (OSM ODbL)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract actual OSM roads, landcover and buildings
        run: python -u scripts/build_sanya_roads.py
      - name: Commit offline map vectors without proprietary tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sanya-roads.json data/sanya-detail-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(v35): refresh local OSM map features"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
