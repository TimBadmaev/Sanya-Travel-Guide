name: Generate original Russian audio guides

# One-time asset build for the content branch. Generated MP3s are intentionally
# NOT part of the app's mandatory offline precache.
on:
  push:
    branches: [feature/audio-guides-v31]
    paths:
      - data/audio-guides.json
      - scripts/render_audio.py
      - .github/workflows/generate-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-guides-v31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline synthesis engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "piper-tts==1.3.0"
          ffmpeg -version | head -n 1
      - name: Download model temporarily (never publish voice weights)
        run: |
          mkdir -p /tmp/piper
          curl --fail --location --retry 3 -o /tmp/piper/ru_RU-denis-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/denis/medium/ru_RU-denis-medium.onnx
          curl --fail --location --retry 3 -o /tmp/piper/ru_RU-denis-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/denis/medium/ru_RU-denis-medium.onnx.json
          test "$(stat -c%s /tmp/piper/ru_RU-denis-medium.onnx)" -gt 10000000
      - name: Render narration for all verified places
        run: |
          python scripts/render_audio.py --model /tmp/piper/ru_RU-denis-medium.onnx
          python scripts/verify_audio.py
      - name: Commit generated MP3 to audio branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3
          if git diff --cached --quiet; then
            echo "Audio already up to date"
          else
            git commit -m "build(audio): narrate 57 original Russian guides"
            git push origin HEAD:feature/audio-guides-v31
          fi
