name: Generate v34 neutral male Russian audio
on:
  push:
    branches: [feature/bright-maps-voice-v34]
    paths:
      - 'scripts/render_audio_v3.py'
      - '.github/workflows/generate-audio-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bright-maps-voice-v34
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice synthesizer and AAC tools
        run: |
          python -m pip install 'piper-tts==1.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download established Russian male model as build dependency
        run: |
          mkdir -p /tmp/piper
          curl --fail --location --retry 3 -o /tmp/piper/ru_RU-denis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/denis/medium/ru_RU-denis-medium.onnx
          curl --fail --location --retry 3 -o /tmp/piper/ru_RU-denis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/denis/medium/ru_RU-denis-medium.onnx.json
      - name: Render all 33 episodes with low ambient bed
        run: python -u scripts/render_audio_v3.py --model /tmp/piper/ru_RU-denis-medium.onnx
      - name: Store 33 compressed recordings in branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio-v3/*.m4a data/audio-sizes-v3.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(audio): 33 neutral Russian male narrations"
          git fetch origin feature/bright-maps-voice-v34
          git rebase origin/feature/bright-maps-voice-v34
          git push origin HEAD:feature/bright-maps-voice-v34
