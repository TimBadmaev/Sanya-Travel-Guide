<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f8fcf8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Открой Хайнань" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Открой Хайнань — игра-путешествие</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/island.css" />
</head>
<body>
  <div id="app" class="quest-app">
    <header class="app-header">
      <a class="app-header__brand" href="#/" aria-label="Открой Хайнань — на главную">
        <span class="app-header__brand-icon" aria-hidden="true">🏝️</span>
        <span class="app-header__brand-name">ОСТРОВ ОТКРЫТИЙ</span>
      </a>
      <a class="app-header__profile" href="#/me" aria-label="Мой профиль">🎒</a>
    </header>
    <main id="view" class="app-main"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <a href="#/" class="bottom-nav__item" data-route="/">
        <span class="bottom-nav__icon" aria-hidden="true">🗺️</span>
        <span class="bottom-nav__label">Путь</span>
      </a>
      <a href="#/discover" class="bottom-nav__item" data-route="/discover">
        <span class="bottom-nav__icon" aria-hidden="true">🔍</span>
        <span class="bottom-nav__label">Открытия</span>
      </a>
      <a href="#/passport" class="bottom-nav__item" data-route="/passport">
        <span class="bottom-nav__icon" aria-hidden="true">🎨</span>
        <span class="bottom-nav__label">Карта</span>
      </a>
      <a href="#/me" class="bottom-nav__item" data-route="/me">
        <span class="bottom-nav__icon" aria-hidden="true">🎒</span>
        <span class="bottom-nav__label">Моё</span>
      </a>
    </nav>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
